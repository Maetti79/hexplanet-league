name: Play a league round
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['engine/**', 'scripts/round.mjs', 'index.html', '.github/workflows/round.yml']
  workflow_dispatch:
    inputs:
      force:
        description: Play even if no core changed
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: league-data
  cancel-in-progress: false
jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Play
        run: node scripts/round.mjs ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force)) && '--force' || '' }}
      - name: Publish results
        run: |
          git config user.name "hexplanet-league[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "League round" || exit 0
          git pull --rebase && git push
